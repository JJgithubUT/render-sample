name: CI - Build y pruebas

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  # Pruebas programadas. GitHub Actions no permite menos de 5 minutos:
  # "* * * * *" (cada minuto) se ejecutaría igual cada 5 min o más.
  schedule:
    - cron: "*/5 * * * *"
  # Botón "Run workflow" para lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: npm test

      - name: Ejecutar build
        run: npm run build

      - name: Guardar artefacto del build
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
